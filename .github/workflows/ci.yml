# GitHub Actions CI for go-mqtt.
#
# Jobs: lint (go vet + gofumpt + golangci-lint), test (race detector
# across the OS triplet consumers build on), fuzz-smoke (10s per Fuzz
# target in ./protocol — a cheap regression net between the periodic
# longer `make fuzz` runs), e2e (docker-composed mosquitto + emqx
# brokers exercised by ./e2e). Concurrency cancels stale runs on the
# same ref so a fast-pushing developer isn't billed for outdated
# commits.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  # The tools below are pinned, not @latest. Dependabot tracks go.mod
  # requires, not go-install lines in a workflow, so these are bumped by
  # hand — deliberately: raise the version, run `make check`, and fix or
  # justify whatever the new release finds in the same change. Floating on
  # @latest makes these gates report on the calendar rather than on the
  # diff, and turns an unrelated upstream release into a red CI on someone
  # else's PR. gofumpt is the sharpest case: it is a formatter, so a new
  # release rewraps untouched code and reds main overnight. Keep these in
  # step with the versions `make setup` installs.
  GOFUMPT_VERSION: "v0.11.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          diff=$(gofumpt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofumpt would rewrite:"
            echo "$diff"
            exit 1
          fi
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint run ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          # Race detector requires CGo; enable just for this step.
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=120s ./...

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz smoke (10s per ./protocol Fuzz target)
        run: make fuzz-smoke

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # e2e-up blocks until both brokers report readiness in their logs —
      # a TCP probe against the docker-proxied host ports is meaningless
      # (the proxy accepts before the broker inside listens).
      - name: start e2e brokers (mosquitto + emqx)
        run: make e2e-up
      - name: run e2e tests
        run: make test-e2e
      - name: dump broker logs
        if: always()
        run: |
          echo "== gomqtt-e2e-mosquitto logs =="
          docker logs gomqtt-e2e-mosquitto || true
          echo "== gomqtt-e2e-emqx logs =="
          docker logs gomqtt-e2e-emqx || true
      - name: stop e2e brokers
        if: always()
        run: make e2e-down
